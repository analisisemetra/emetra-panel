<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1311">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EMETRA">
<title>EMETRA Analítica</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="img/emetra-logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap">
<link rel="stylesheet" href="css/estilos.css">
<script>
  // Tema antes de pintar (evita un destello oscuro/claro al abrir)
  try { var t = localStorage.getItem('emetra.tema') || 'auto'; document.documentElement.dataset.tema = t === 'auto' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'oscuro') : t; } catch (e) {}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script type="module" src="js/app.js"></script>
</head>
<body>

<!-- Entrada -->
<div class="entrada oculto" id="entrada">
  <div class="arte" aria-hidden="true">
    <div class="marca grande"><img src="img/emetra-logo-blanco.svg" alt=""><span class="sub">Analítica</span></div>
    <div class="lema">AUTORIDAD Y SERVICIO</div>
  </div>
  <div class="formulario">
    <form class="caja" id="formEntrada" autocomplete="on">
      <div class="marca"><img class="logo-tema" src="img/emetra-logo-blanco.svg" alt="EMETRA"><span class="sub">Analítica</span></div>
      <h2>Bienvenido</h2>
      <p class="nota" style="margin:-8px 0 4px">Herramienta de análisis de opinión pública. Uso exclusivamente institucional.</p>
      <label class="campo">Usuario<input type="text" id="campoUsuario" autocomplete="username" autocapitalize="none" required></label>
      <label class="campo">Contraseña<input type="password" id="campoPass" autocomplete="current-password" required></label>
      <button class="btn primario" id="btnEntrar" type="submit">Entrar</button>
      <div class="error" id="errorEntrada" role="alert"></div>
    </form>
  </div>
</div>

<!-- Aplicación -->
<div class="app oculto" id="app">
  <aside class="menu" id="menu">
    <div class="marca marca-menu"><img class="logo-tema" src="img/emetra-logo-blanco.svg" alt="EMETRA"><span class="sub">Analítica</span></div>
    <nav id="nav" aria-label="Secciones"></nav>
    <button class="usuario" id="botonUsuario" type="button" style="background:none;color:inherit;text-align:left;cursor:pointer;width:100%">
      <div class="avatar" id="usuarioAvatar"></div>
      <div style="min-width:0"><div class="nombre" id="usuarioNombre"></div><div class="rol" id="usuarioRol"></div></div>
    </button>
  </aside>
  <div class="principal">
    <header class="barra">
      <div style="min-width:0"><div class="migas" id="migas"></div><h1 id="tituloSeccion">Inicio</h1></div>
      <div class="derecha">
        <span class="vivo" id="actualizado"></span>
        <button class="filtro-boton" id="botonFiltro" type="button" aria-label="Elegir periodo y página"></button>
        <a class="btn icono" href="#buscar" id="botonBuscar" aria-label="Buscar comentarios"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"/></svg></a>
      </div>
    </header>
    <main class="contenido" id="contenido"></main>
  </div>
  <nav class="navbar" id="navbar" aria-label="Secciones principales"></nav>
</div>
<div class="marca-agua oculto" id="marcaAgua" aria-hidden="true"></div>
</body>
</html>
